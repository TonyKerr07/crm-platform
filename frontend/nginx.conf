server {
    listen 80;
    server_name localhost;

    # Compressão gzip — deixa o carregamento mais rápido
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # ── Proxy para o backend ───────────────────────────────────
    # Toda requisição que começa com /api vai para o Spring Boot
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # ── Angular SPA (Single Page Application) ─────────────────
    # Qualquer rota que não seja um arquivo existente → index.html
    # Isso é ESSENCIAL para o roteamento do Angular funcionar.
    # Sem isso, ao acessar /clients diretamente dá 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para arquivos estáticos (CSS, JS, imagens)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
